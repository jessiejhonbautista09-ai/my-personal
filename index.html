<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Personal – My Final Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alegreya:wght@400;500&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    /* Sunset sky: replace with  url("your-image.jpg") center / cover  to use a real photo */
    background:
      radial-gradient(ellipse at 15% 25%, rgba(150, 120, 200, .75), transparent 55%),
      radial-gradient(ellipse at 85% 20%, rgba(190, 130, 190, .6), transparent 50%),
      radial-gradient(ellipse at 20% 85%, rgba(255, 190, 170, .9), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(240, 170, 190, .85), transparent 55%),
      linear-gradient(180deg, #a2479b 0%, #b5739f 35%, #c98fb4 60%, #f2b3a8 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  /* ---------- Navbar ---------- */
  .nav {
    background: linear-gradient(180deg, #580a80, #6e2593);
    color: #fff;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 32px;
    padding: 24px 52px;
    min-height: 104px;
  }
  .brand { font-weight: 700; font-size: 38px; color: #fff; text-decoration: none; }
  .nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 24px; }
  .nav a.link {
    font-family: "Alegreya", Georgia, serif;
    font-size: 25px;
    color: #fff;
    text-decoration: none;
  }
  .nav a.link:hover, .nav a.link:focus-visible { color: #f5b8ff; text-decoration: none; }

  /* ---------- Hero ---------- */
  .hero { padding: 16px 52px 64px; }
  .hero h1.title {
    font-family: "Abril Fatface", serif;
    font-weight: 400;
    font-size: clamp(44px, 6vw, 80px);
    color: #231f20;
    text-align: center;
    margin: 0 0 40px;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 24px;
    align-items: end;
  }

  .name {
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: clamp(40px, 5.8vw, 110px);
    line-height: 1.3;
    color: #fff;
    margin: 0;
  }
  .name span { display: block; }
  .name .first { white-space: nowrap; }
  .name .last { padding-left: 1.15em; }

  .quote {
    font-size: clamp(22px, 2.6vw, 36px);
    line-height: 1.45;
    color: #7a1f24;
    text-align: center;
    margin: 0 0 24px;
  }

  /* ---------- Buttons ---------- */
  .actions { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 8px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 38px;
    border-radius: 999px;
    border: 1px solid #3a2a40;
    font-weight: 700;
    font-size: 18px;
    text-decoration: none;
    color: #fff;
  }
  .btn.dark { background: #231f20; min-width: 187px; }
  .btn.purple { background: #8b00c4; min-width: 205px; }
  .btn:hover { filter: brightness(1.15); }
  .btn:focus-visible, .nav a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* ---------- Mobile ---------- */
  @media (max-width: 800px) {
    .nav { padding: 20px 24px; }
    .brand { font-size: 28px; }
    .nav a.link { font-size: 20px; }
    .hero { padding: 16px 24px 48px; }
    .hero-grid { grid-template-columns: 1fr; }
    .name .first { white-space: normal; }
    .quote { color: #5e1318; }
  }

  /* ---------- Animation (pure CSS, no JavaScript needed) ---------- */
  @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  @keyframes drop { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: none; } }

  .nav               { animation: drop .6s ease-out both; }
  .hero h1.title     { animation: rise .8s .25s ease-out both; }
  .name .first       { animation: rise .8s .45s ease-out both; }
  .name .last        { animation: rise .8s .65s ease-out both; }
  .quote             { animation: rise .8s .85s ease-out both; }
  .actions           { animation: rise .8s 1.05s ease-out both; }

  .btn { transition: transform .2s ease, filter .2s ease; }
  .btn:hover { transform: translateY(-4px); text-decoration: none; }
  .nav a.link, .brand { transition: color .2s ease; }
  .brand:hover, .brand:focus-visible { color: #f5b8ff; text-decoration: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="nav">
  <a class="brand" href="#top">My Personal</a>
  <nav aria-label="Main">
    <ul>
      <li><a class="link" href="#about">About</a></li>
      <li><a class="link" href="#activities">Activities</a></li>
      <li><a class="link" href="#contacts">Contacts</a></li>
    </ul>
  </nav>
</header>

<main id="top" class="hero">
  <h1 class="title">My Final Activity</h1>

  <div class="hero-grid">
    <div>
      <h2 class="name">
        <span class="first">Jessie Jhon B.</span>
        <span class="last">Bautista</span>
      </h2>
      <div class="actions">
        <a class="btn dark" href="#cv">My CV</a>
        <a class="btn purple" href="#activities">See my Activities</a>
      </div>
    </div>

    <p class="quote">
      Matthew 6:34 — “Take therefore no thought for the morrow: for the morrow
      shall take thought for the things of itself. Sufficient unto the day is
      the evil thereof.”
    </p>
  </div>
</main>

</body>
</html>
